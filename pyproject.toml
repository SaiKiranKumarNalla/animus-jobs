[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animus-jobs"
version = "0.6.0"
description = "Local-first AI career agent: jobs, academia, events and networking, powered by your own Claude / Codex / Gemini subscriptions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "httpx>=0.27",
  "pypdf>=4.0", "python-docx>=1.1", "anthropic>=1.0", "markdown>=3.5",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobagent = "jobagent.cli:main"
animus = "jobagent.cli:main"

[tool.setuptools]
packages = ["jobagent"]

[tool.setuptools.package-data]
jobagent = ["static/*", "packs/*.json"]
